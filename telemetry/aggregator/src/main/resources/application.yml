spring:
  application:
    name: aggregator
  config:
    import: optional:configserver:http://localhost:8888

aggregator:
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: telemetry.aggregator
      poll-timeout: 100ms
    topics:
      sensors: telemetry.sensors.v1
      snapshots: telemetry.snapshots.v1
